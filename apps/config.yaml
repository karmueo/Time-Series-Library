# TimesNet Predictor YAML Configuration (Python版本)
# 所有参数可以通过命令行覆盖

# 接收器配置 (组播接收)
receiver:
  group: "230.1.1.22"      # 输入组播地址
  port: 8002               # 输入端口
  iface: "192.168.1.112"         # 输入网卡接口
  bind_ip: ""              # 绑定 IP (空表示所有)
  timeout_s: 2.0           # 接收超时时间
  skip_checksum: true     # 跳过校验和验证

# 发布器配置 (组播发送)
publisher:
  group: "230.1.1.24"      # 输出组播地址
  port: 8011               # 输出端口
  iface: "192.168.1.112"         # 输出网卡接口
  ttl: 1                   # 组播 TTL

# 预测器配置
predictor:
  model_path: "checkpoints/checkpoint.pth"  # 模型 checkpoint 路径 (.pth 或 .onnx)
  model: "TimesNet"        # 模型类型 (仅 PyTorch)
  num_classes: 2           # 类别数
  seq_len: 20              # 序列长度
  device: "auto"           # 设备: auto|cpu|cuda
  # PyTorch 模型参数 (仅在使用 .pth 模型时需要)
  d_model: 128              # d_model
  n_heads: 4               # n_heads
  d_ff: 256                # d_ff
  top_k: 3                 # top_k
  freq: "s"                # freq

# 轨迹缓冲配置
buffer:
  seq_len: 20              # 序列长度
  min_seq_len: 20          # 最小序列长度
  max_age_s: 10.0          # 轨迹最大保留时间 (秒)
  window_step: 5           # 滑窗步长 (0=每条都推理)

# 归一化配置
normalizer:
  stats_path: "checkpoints/radar_stats.json"  # 归一化统计文件路径 (可选)

# 推理配置
inference:
  publish_interval_ms: 0   # 发布节流毫秒 (0=不节流)
  print_targets: false     # 打印解析后的目标信息
  print_features: false    # 打印送入模型的特征值
  print_batch_progress: false  # 打印 batch/track 进度信息
  use_batch_ema: true     # 同批号目标使用EMA平滑概率并统一判别
  ema_alpha: 0.4           # EMA平滑系数(0-1)

# 本地测试配置 (启用后将使用本地 .xls/.csv 代替组播输入)
local_test:
  enabled: false           # 是否启用本地文件测试
  path: ""                 # 本地 .xls/.csv 路径
  points: 20               # 读取点数 (默认前 20)

# 航迹保存配置 (按批号输出一个文件)
track_save:
  enabled: false           # 是否保存航迹文件
  output_dir: "./outputs/track"  # 保存目录
  format: "xls"            # 保存格式: xls 或 csv
